<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Bid Prix — Bid · Build · Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@400;500;600;700&family=Instrument+Serif&family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@500;600&family=Homemade+Apple&display=swap" rel="stylesheet">
<style id="app-css">
:root{--bg:#080d13;--panel:#0f1821;--panel2:#15222e;--line:#263a4c;--txt:#f3ece0;--mut:#9db0bf;--acc:#e23a2e;--acc2:#a8d0e2;--ok:#2fd6a0;
  /* poster palette: cream paper, race red, sky and steel blue; Hexawatts cyan for the partner mark */
  --cream:#f3ece0;--sky:#a8d0e2;--steel:#3a7aa3;--navy:#123048;--hex:#5ce1e6;
  --disp:'Unbounded','Arial Black',system-ui,sans-serif;--tall:'Anton',Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  font-family:'Chakra Petch','Avenir Next','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--txt);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 11px,#e23a2e09 11px 12px,transparent 12px 37px,#e23a2e06 37px 40px),radial-gradient(1200px 700px at 82% -12%,#1f4766 0,transparent 60%),radial-gradient(900px 600px at -10% 112%,#5a1a14 0,transparent 60%)}
body.mono::before{display:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{opacity:.4;cursor:not-allowed}
h1,h2,h3,p{margin:0}
.hexa{display:inline-block;width:auto;vertical-align:middle;flex:none}
.collab{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.collab i{font-style:normal;opacity:.55;margin:0 1px}
.brand small .collab{gap:7px;margin-top:5px}
.brand small .collab i{font-size:15px;opacity:.7}
@media(max-width:640px){.brand small .collab .hexa{height:20px!important}.brand small .collab{gap:5px;margin-top:3px}}
.lcol{font-size:inherit;letter-spacing:inherit}
.lgs{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 12px;width:100%}
.back.cover .lgs .llogo,.hxt{width:min(38%,170px);aspect-ratio:1;margin:0;border-radius:4px}
.hxt{display:grid;place-items:center;background:#000}
.hxt .hexa{width:84%;height:auto!important}
@media(max-width:640px){.lcol{display:none}}
svg.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- chrome ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:rgba(9,4,5,.96);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.flag{width:34px;height:34px;border-radius:8px;flex:none;background:conic-gradient(#fff 25%,#111 0 50%,#fff 0 75%,#111 0) 0 0/17px 17px;box-shadow:0 0 0 1px var(--line)}
.brand b{display:block;font-size:17px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--mut);letter-spacing:.22em;text-transform:uppercase;font-size:10px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--panel);padding:4px;border-radius:12px;border:1px solid var(--line)}
.tabs button{padding:8px 16px;border-radius:9px;color:var(--mut);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;white-space:nowrap}
.tabs button.on{background:var(--acc);color:#fff}
.tabs button i{font-style:normal;opacity:.6;margin-right:6px}
.teampill{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.page{padding:20px;max-width:1500px;margin:0 auto;overflow-x:clip}   /* cards dealing in from off-screen never cause a sideways scroll */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600;letter-spacing:.04em;font-size:13px}
.btn:hover:not(:disabled){border-color:#35546c}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover:not(:disabled){filter:brightness(1.1)}
.btn.big{padding:13px 26px;font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.ghost{background:transparent}
.eyebrow{color:var(--mut);letter-spacing:.2em;text-transform:uppercase;font-size:11px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field span{color:var(--mut);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.inp{background:#0a1219;border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%;outline:none}
.inp:focus{border-color:var(--acc)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px 2px 5px;border-radius:7px;font-size:12px;font-weight:700;color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 45%,transparent);background:color-mix(in srgb,var(--tc) 10%,transparent)}
.chip svg{width:13px;height:13px}

/* ---------- 3D card ---------- */
.card{--tc:#8d97ab;container-type:inline-size;width:100%;aspect-ratio:5/7;perspective:1000px;position:relative;cursor:pointer;user-select:none;-webkit-user-select:none;white-space:normal;text-align:left}
.card-tilt,.card-inner{position:absolute;inset:0;transform-style:preserve-3d}
.card-tilt{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.card.tilt .card-tilt{transition:transform .08s linear}
.card-inner{transition:transform .65s cubic-bezier(.3,.9,.3,1)}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;transform-style:preserve-3d}
.face.back{transform:rotateY(180deg)}
.face>*{backface-visibility:hidden;-webkit-backface-visibility:hidden}
/* bento card: dark frame, paper panels, tier-colour block with striped numeral, 3D part popping out of the main panel */
.fbg{position:absolute;inset:0;border-radius:6.6cqw;background:#1a1614;padding:1.3cqw;display:grid;grid-template-columns:31% 1fr 19%;grid-template-rows:14.5% 1fr 10.5%;gap:1.3cqw;transform-style:preserve-3d;box-shadow:0 34px 60px -28px #000d,0 0 0 1px #00000030}
.pn{background:#f4f2ef;border-radius:2.6cqw;position:relative;min-width:0;min-height:0;color:#1a1614}
.p-top{grid-column:1/3;border-top-left-radius:5.4cqw;display:flex;align-items:center;padding:0 5cqw;font-family:var(--disp);font-weight:700;font-size:7.6cqw;letter-spacing:-.03em;white-space:nowrap;overflow:hidden}
.p-top i{font-style:normal;color:var(--tc)}
.p-disc{grid-column:3;border-top-right-radius:5.4cqw;display:grid;place-items:center}
.disc{width:70%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;transition:transform 1s cubic-bezier(.2,.8,.2,1);
  background:radial-gradient(circle at 38% 34%,#ffffffb0,transparent 42%),conic-gradient(from 20deg,#e9eaec,#9d9fa3 12%,#f4f5f6 25%,#7f8286 38%,#dfe0e2 50%,#a3a5a8 62%,#f0f1f2 75%,#8a8d91 88%,#e9eaec);
  box-shadow:inset 0 0 0 .5cqw #ffffff90,inset 0 0 3cqw #00000066,0 .4cqw 1cqw #0004}
.disc svg{width:44%;height:44%;color:#1a1614;opacity:.7;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.card:hover .disc,.card.tilt .disc{transform:rotate(180deg)}
.p-side{grid-row:2;grid-column:1;background:var(--tc);overflow:hidden;display:flex;flex-direction:column}
.hatch{flex:none;height:23%;border-bottom:.5cqw solid #1a1614;background:repeating-linear-gradient(-45deg,#1a1614 0 1.3cqw,#0000 1.3cqw 3.6cqw);background-size:5.1cqw 5.1cqw}
.card:hover .hatch,.card.tilt .hatch{animation:hatch .9s linear infinite}
@keyframes hatch{to{background-position:5.1cqw 0}}
.num{position:relative;height:20cqw;margin:4cqw 0 0 2.6cqw;font-family:var(--tall);font-size:21cqw;line-height:.95;letter-spacing:-.01em}
.num span{position:absolute;left:0;top:0;color:transparent;background:repeating-linear-gradient(180deg,#1a1614 0 1.05cqw,#0000 1.05cqw 1.75cqw);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.num span:nth-child(1){transform:translateX(16%);opacity:.22}
.num span:nth-child(2){transform:translateX(8%);opacity:.5}
.card:hover .num span:nth-child(1),.card.tilt .num span:nth-child(1){transform:translateX(26%)}
.card:hover .num span:nth-child(2),.card.tilt .num span:nth-child(2){transform:translateX(13%)}
.p-side .tier{margin:auto 0 2.6cqw 3.2cqw;align-self:flex-start;background:#1a1614;color:#f4f2ef;border-radius:99px;font:600 2.7cqw/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;padding:1.5cqw 2.3cqw}
.p-side .stars{margin:0 0 3.4cqw 3cqw;align-self:flex-start;font-size:4.1cqw;letter-spacing:0;background:linear-gradient(90deg,#1a1614 var(--p),#00000030 var(--p));-webkit-background-clip:text;background-clip:text}
.p-main{grid-row:2;grid-column:2/4;display:flex;flex-direction:column;padding:2.6cqw 3.6cqw 3cqw;transform-style:preserve-3d}
.cmono{display:flex;justify-content:space-between;align-items:center;font:500 3cqw/1 var(--mono);letter-spacing:.04em;color:#1a1614;white-space:nowrap}
.cmono button{font:inherit;color:inherit;padding:.8cqw 1.6cqw;border-radius:99px;background:#1a16140e;line-height:1;transition:background .2s,color .2s}
.cmono button:hover{background:#1a1614;color:#fff}
.art{height:42%;margin:1.4cqw -5cqw 1cqw;display:flex;align-items:center;justify-content:center;transform:translateZ(24cqw);position:relative}   /* flex, so the render stays inside its box and off the part name */
.art img,.art svg{width:100%;height:100%;object-fit:contain;display:block;transition:transform .7s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 10cqw 7cqw rgba(0,0,0,.28))}
.card:hover .art img,.card.tilt .art img{transform:translateY(-5%) scale(1.1) rotate(-3deg)}
.p-main .cap,.p-main h3,.p-main .tagl{position:relative;transform:translateZ(26cqw)}   /* the part name sits in front of its 3D render */
.cap{font:500 2.6cqw/1 var(--mono);letter-spacing:.14em;color:#8a8583;text-transform:uppercase;margin:1.4cqw 0 2cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card h3{font-family:var(--disp);font-weight:700;font-size:4.5cqw;line-height:1.12;letter-spacing:-.01em;margin:0 0 1cqw;color:#1a1614;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tagl{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:3.9cqw;line-height:1.15;color:#625b58;margin:0}
.stats{margin-top:auto}
.st{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2.2cqw;font:500 2.6cqw/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-top:1.6cqw}
.st span{color:#8a8583;white-space:nowrap}
.st i{height:.9cqw;border-radius:9px;background:#1a161418;overflow:hidden;display:block}
.st u{display:block;height:100%;border-radius:9px;background:var(--tc)}
.st em{font-style:normal;color:#1a1614;white-space:nowrap}
/* card back: the spec readout is the point of that face, so it runs larger and fully black */
.p-back .st{font-size:3.4cqw;gap:2.8cqw;margin-top:2.4cqw;letter-spacing:.05em}
.p-back .st span,.p-back .st em{color:#1a1614}
.p-back .st i{height:1.2cqw;background:#1a161422}
.p-foot{grid-row:3;grid-column:1/4;background:#1a1614;box-shadow:inset 0 0 0 1px #ffffff16;border-bottom-left-radius:5.4cqw;border-bottom-right-radius:5.4cqw;display:flex;align-items:center;padding:0 4.6cqw;color:#f4f2ef}
.price{flex:1;display:flex;align-items:baseline;gap:1.6cqw;font:600 3cqw/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.price b{margin-left:auto;font-family:var(--tall);font-weight:400;font-size:6.6cqw;color:#ec5345;letter-spacing:.02em}
.lay{position:absolute;left:0;right:0}
.stamp{top:36%;display:flex;justify-content:center;transform:translateZ(22cqw) rotate(-13deg);pointer-events:none}
.stamp span{font-size:15cqw;font-weight:700;letter-spacing:.08em;color:var(--sc);border:1.2cqw solid var(--sc);border-radius:3cqw;padding:0 4cqw;background:#000000b8;text-shadow:0 0 4cqw var(--sc);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:scale(2.6);opacity:0}to{transform:none;opacity:1}}
.card.sold .p-top,.card.sold .p-disc,.card.sold .p-side,.card.sold .p-main{opacity:.38}
.ribbon{top:-3.4cqw;display:flex;justify-content:center;transform:translateZ(20cqw);pointer-events:none}
.ribbon span{background:var(--ok);color:#03130d;font-weight:700;font-size:4.2cqw;letter-spacing:.18em;padding:1cqw 4cqw;border-radius:99px;box-shadow:0 0 5cqw var(--ok)}
.card.inst .fbg{box-shadow:0 34px 60px -28px #000d,0 0 0 2.2cqw var(--ok)}
.fbg.bk{display:block}
.p-back{position:absolute;inset:1.3cqw;border-radius:5.4cqw;padding:4.4cqw 5cqw 5cqw;display:flex;flex-direction:column}
.p-back .cmono{margin-bottom:3.4cqw}
.p-back h3{-webkit-line-clamp:3;font-size:5.2cqw}
.p-back p{font-size:3.9cqw;line-height:1.3;color:#3d3734;margin:1cqw 0 3cqw}
.p-back .tl{margin-top:auto;font:500 2.7cqw/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#8a8583;text-align:center}
.p-back .tl .stars{font-size:4.6cqw;display:block;width:max-content;margin:0 auto;background:linear-gradient(90deg,var(--tc) var(--p),#1a161426 var(--p));-webkit-background-clip:text;background-clip:text}
.stars{display:inline-block;font-size:5.4cqw;line-height:1;letter-spacing:.04em;font-style:normal;background:linear-gradient(90deg,var(--acc2) var(--p),#ffffff36 var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.stars.big{font-size:24px}
.bangrow{margin:-6px 0 16px}
.banger{font-size:17px;font-style:italic;font-weight:600;color:#fff;margin-top:4px}
/* card art */
.a-line{stroke:var(--tc);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.a-fill{fill:color-mix(in srgb,var(--tc) 14%,transparent)}
.a-dim{opacity:.38}
.a-hot{filter:drop-shadow(0 0 3px var(--tc))}
.a-dot{fill:var(--tc)}
.a-ti{stroke:#c58bff;fill:#5cc8ff55}
.a-num{font-size:13px;font-weight:700;fill:var(--tc);text-anchor:middle}
.a-num.off{opacity:.4}
.a-big{font-size:30px;font-weight:700;fill:var(--tc);text-anchor:middle}
.a-tag{font-size:9px;letter-spacing:.22em;font-weight:600;fill:var(--tc);opacity:.75;text-anchor:middle}
.a-flow{stroke:#ffffff;stroke-width:1.2;fill:none;opacity:.35;stroke-dasharray:10 14;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-48}}
.a-hl .hl{fill:color-mix(in srgb,var(--tc) 40%,transparent);stroke:var(--tc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--tc))}

/* ---------- auction ---------- */
.auction{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.cats button{display:flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-weight:600}
.cats button.on{border-color:var(--acc);background:linear-gradient(180deg,#e23a2e2e,#e23a2e08)}
.cats small{color:var(--mut);font-weight:500}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:24px}
@media(min-width:1180px){.cardgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.teams{display:flex;flex-direction:column;gap:10px}
.tcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:10px 12px}
.tcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tcard b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard .left{font-size:19px;font-weight:700;color:var(--acc2);white-space:nowrap}
.tcard .left small{font-size:13px;color:var(--mut);font-weight:500;margin-left:3px}
.bar{height:4px;border-radius:9px;background:#ffffff12;margin:6px 0 8px;overflow:hidden}
.bar u{display:block;height:100%;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
.none{color:var(--mut);font-size:12px}

/* ---------- overlay ---------- */
#overlay:empty{display:none}
#overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.ov-bg{position:fixed;inset:0;background:rgba(6,1,2,.94)}
.ov-box{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px;width:min(480px,100%);box-shadow:0 30px 80px -20px #000;animation:pop .25s ease-out}
.ov-box.wide{width:min(940px,100%)}
@keyframes pop{from{transform:translateY(14px) scale(.97);opacity:0}}
.ov-x{position:absolute;top:10px;right:12px;font-size:24px;color:var(--mut);width:32px;height:32px}
.blk{display:grid;grid-template-columns:320px minmax(0,1fr);gap:34px;align-items:center}
.blk-card{perspective:1200px;padding:6px}
.sway{animation:sway 7s ease-in-out infinite;transform-style:preserve-3d}
@keyframes sway{0%,100%{transform:rotateY(-9deg)}50%{transform:rotateY(9deg)}}
.blk-panel h2{font-size:28px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1;margin:4px 0 14px}
.bidbox{background:#0a1219;border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:16px}
.bidnum{font-size:50px;font-weight:700;line-height:1;color:var(--acc2)}
.bidnum span{font-size:16px;color:var(--mut);margin-left:6px}
.leader{display:flex;align-items:center;gap:8px;font-weight:600;margin-top:4px}
.nextrow{display:flex;align-items:center;gap:8px;margin:14px 0 10px;color:var(--mut);font-size:13px}
.nextrow input{width:96px;text-align:center;font-weight:700;font-size:16px;color:var(--txt)}
.nextrow button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:18px;color:var(--txt)}
.bidteams{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.bidteams button{text-align:left;padding:9px 12px;border-radius:11px;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--panel2)}
.bidteams button:hover:not(:disabled){background:#1a2b3a}
.bidteams button.lead{outline:2px solid var(--acc2)}
.bidteams b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bidteams small{color:var(--mut)}
.bidteams{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.bteam{display:flex;gap:4px;min-width:0}
/* Undo, Next and Sold stay on screen however long the team list runs */
.blk-panel .blk-actions{position:sticky;bottom:0;z-index:4;background:#050505;padding:10px 0;box-shadow:0 -12px 16px -12px #000}
/* phones: the price box wraps (price and timer, then the next step); the block scrolls as one column, so nothing is pinned */
@media(max-width:640px){.blk-panel .blk-actions{position:static;box-shadow:none;padding:0}.bidbox{flex-wrap:wrap;gap:10px}.bidbox>div:last-child{margin-left:0!important;text-align:left!important;flex-basis:100%}.ltimer{margin-left:auto}}
.bteam>button:first-child{flex:1;min-width:0}
.bidteams .bplus{flex:none;width:60px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-left:1px solid var(--line);font-size:24px;font-weight:700;line-height:1;text-align:center}
.bidteams .bplus small{font-size:10px;font-weight:600;letter-spacing:.02em}
.songrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:4px 0}
.songrow b{font-size:13px;font-weight:600;color:var(--acc2);min-width:0;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltimer{align-self:flex-start;margin-left:14px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--txt);font:600 18px/1 var(--mono);letter-spacing:.04em;min-width:64px}
.ltimer.low{color:#ff6b5e;border-color:#ff6b5e}
.ltimer.up{color:#fff;background:var(--acc);border-color:var(--acc);animation:tpulse .8s ease-in-out infinite alternate}
@keyframes tpulse{to{opacity:.55}}
.lb td.pos small{font-size:11px;font-weight:500;color:var(--mut)}
.blk-actions{display:flex;gap:10px;margin-top:16px;align-items:center}
.blk-actions .pri{flex:1}
.soldto{font-size:20px;padding:16px;border-radius:14px;border:1px solid var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent);margin-bottom:16px}
.soldto b{color:var(--acc2)}

/* ---------- setup / packages ---------- */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.panel h2{font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.trow{display:grid;grid-template-columns:38px 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.trow input[type=color]{width:38px;height:38px;padding:2px;border-radius:9px;border:1px solid var(--line);background:#0a1219}
.steps{counter-reset:s;display:grid;gap:12px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;color:#c3cadb}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:grid;place-items:center}
.steps b{color:#fff}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pk{border-top:4px solid var(--c)}
.pk h3{font-size:19px}
.pk .meta{color:var(--mut);font-size:13px;margin:2px 0 12px}
.pkl{display:grid;gap:5px;margin-bottom:6px}
.pkl div{display:flex;align-items:center;gap:8px;font-size:13px}
.pkl em{margin-left:auto;font-style:normal;color:var(--mut)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.status.ok{color:var(--ok);border-color:var(--ok)}
.status.warn{color:var(--acc2);border-color:var(--acc2)}
textarea.inp{min-height:76px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all}

/* ---------- race ---------- */
.race{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.race-side{display:grid;gap:14px}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tracks button{text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2)}
.tracks button.on{border-color:var(--acc);background:linear-gradient(180deg,#e23a2e2e,#e23a2e08)}
.tracks b{display:block}
.tracks small{color:var(--mut);font-size:12px}
.tdesc{color:var(--mut);font-size:13px;margin-top:10px}
.tog{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:10px;cursor:pointer}
.tog input{width:17px;height:17px;accent-color:var(--acc)}
.grid-e{display:grid;gap:6px}
.ge{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 10px;border-radius:10px;background:var(--panel2);border-left:4px solid var(--c)}
.ge b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ge small{color:var(--mut);margin-left:auto;white-space:nowrap}
.hud{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.hud b{display:block;font-size:20px;text-transform:uppercase;letter-spacing:.05em}
.clock{margin-left:auto;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--acc2)}
.spd{display:flex;gap:4px}
.spd button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);font-weight:700;font-size:12px}
.spd button.on{background:var(--txt);color:#000}
.stage{position:relative;background:#0a1219;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stage canvas{display:block;width:100%}
.lights{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:none;gap:9px;padding:9px 13px;background:#000d;border-radius:13px;border:1px solid #333}
.lights.show{display:flex}
.lights i{width:20px;height:20px;border-radius:50%;background:#2a0d10}
.lights i.on{background:#e8483b;box-shadow:0 0 16px #e8483b}
table.lb{width:100%;border-collapse:collapse;margin-top:14px;font-variant-numeric:tabular-nums}
.lb th{text-align:left;color:var(--mut);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:6px 10px;font-weight:600}
.lb td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap}
.lb td.pos{font-weight:700;font-size:17px;width:36px}
.lb tr.p1 td.pos{color:var(--acc2)}
.lb .tn{display:flex;align-items:center;gap:8px;font-weight:600}
.lb .tn small{color:var(--mut);font-weight:400}
.winner{margin-top:14px;padding:16px 20px;border-radius:14px;border:1px solid var(--acc2);background:linear-gradient(90deg,#a8d0e226,transparent);display:flex;align-items:center;gap:16px;font-size:18px}
.winner .cup{font-size:34px;font-weight:700;color:var(--acc2)}
.winner small{display:block;color:var(--mut);font-size:12px;letter-spacing:.16em;text-transform:uppercase}

/* ---------- garage ---------- */
.garage{display:grid;grid-template-columns:400px minmax(0,1fr);gap:26px;align-items:start;padding-bottom:90px}
.bay{position:sticky;top:76px}
.carbox{border-radius:14px;padding:10px 6px 0;background:linear-gradient(180deg,#0a1219,#12202c);border:1px solid var(--line);position:relative;overflow:hidden}
.carbox::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(90deg,#ffffff0a 0 30px,transparent 30px 60px)}
.carsvg{width:100%;display:block;position:relative;z-index:1}
.carsvg .hl{fill:#161b27;stroke:#ffffff66;stroke-width:1;stroke-linejoin:round}
.crating{position:absolute;top:10px;left:12px;z-index:2;font-size:30px;font-weight:700;line-height:1;color:var(--acc2)}
.crating small{display:block;font-size:10px;letter-spacing:.2em;color:var(--mut)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.slot{text-align:left;padding:8px 10px;border-radius:11px;border:1px solid color-mix(in srgb,var(--tc) 50%,transparent);background:color-mix(in srgb,var(--tc) 8%,var(--panel2))}
.slot small{display:flex;align-items:center;gap:5px;color:var(--mut);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.slot b{display:block;font-size:13px;line-height:1.2;margin-top:2px}
.spec{display:grid;gap:7px}
.sp{display:grid;grid-template-columns:104px 1fr 92px;gap:10px;align-items:center;font-size:13px}
.sp span{color:var(--mut)}
.sp i{height:5px;border-radius:9px;background:#ffffff12;overflow:hidden}
.sp u{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .4s}
.sp em{font-style:normal;font-weight:700;text-align:right}
.pcat{margin-bottom:26px;scroll-margin-top:80px}
.pcat h2{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px}
.pcat h2{flex-wrap:wrap}
.pcat h2 small{color:var(--mut);font-weight:500;letter-spacing:.04em;text-transform:none}
.prow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,190px));gap:20px}
.deal .card{animation:deal .6s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*70ms)}
@keyframes deal{from{transform:translateY(60px) rotate(8deg) scale(.7);opacity:0}}
.gbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;gap:14px;padding:12px 20px;background:rgba(9,4,5,.97);border-top:1px solid var(--line)}
.gbar .sum{font-size:13px;color:var(--mut);min-width:0}
.gbar .sum b{color:var(--txt);font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .btn{margin-left:auto;flex:none}
.cratewrap{min-height:70vh;display:grid;place-items:center;text-align:center}
.cratewrap h1{font-size:30px;text-transform:uppercase;letter-spacing:.04em;margin:26px 0 8px}
.cratewrap p{color:var(--mut);margin-bottom:22px}
.crate{width:170px;height:130px;margin:0 auto;position:relative;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-2deg)}}
.crate::before{content:"";position:absolute;inset:26px 0 0;border-radius:8px;background:repeating-linear-gradient(90deg,#6b4a2b 0 26px,#5a3d22 26px 28px);border:3px solid #3b2714;box-shadow:0 26px 40px -18px #000,0 0 50px -10px var(--c)}
.crate::after{content:"PARTS";position:absolute;left:0;right:0;top:62px;text-align:center;font-weight:700;letter-spacing:.3em;color:#2a1a0c;font-size:20px}
.crate i{position:absolute;left:-8px;right:-8px;top:12px;height:24px;border-radius:6px;background:#7a5632;border:3px solid #3b2714}
.crate u{position:absolute;left:0;right:0;top:78px;height:14px;background:var(--c);opacity:.9}
.bsum{display:grid;gap:6px;margin:14px 0}
.bsum div{display:flex;align-items:center;gap:8px;font-size:14px}

#toasts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:#060606;color:#fff;font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;padding:11px 16px 11px 13px;border:1px solid #ffffff2a;border-left:3px solid #fff;border-radius:3px;box-shadow:0 14px 30px -10px #000;animation:pop .25s ease-out;max-width:90vw;overflow:hidden;text-overflow:ellipsis;background-image:repeating-linear-gradient(0deg,transparent 0 2px,#ffffff06 2px 3px)}
.toast.bad{border-left-color:var(--acc);color:var(--acc)}
/* gavel-slam sold banner in the opener's idiom */
.toast.sold{display:flex;align-items:center;gap:16px;background:#050505;color:#fff;border:1px solid #ffffff33;border-top:3px solid var(--acc);border-radius:6px;padding:12px 24px 12px 14px;text-align:left;box-shadow:0 30px 60px -20px #000,0 0 50px -12px var(--acc);background-image:repeating-linear-gradient(0deg,transparent 0 2px,#ffffff06 2px 3px);animation:slam .55s cubic-bezier(.2,1.5,.4,1) both}
.toast.sold .sb{font-family:var(--tall);font-size:38px;line-height:1;color:var(--acc);letter-spacing:.04em;text-transform:uppercase;padding-right:16px;border-right:1px solid #ffffff2a}
.toast.sold .st{font:600 12px/1.5 var(--mono);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.toast.sold .st small{display:inline;margin-left:14px;font-size:11px;color:#9a9a9a;font-weight:500}
.toast.sold .st small b{color:#fff;font-weight:600}
@keyframes slam{from{transform:scale(1.7) rotate(-5deg);opacity:0}}

@media(max-width:980px){
  .auction,.race,.garage,.blk{grid-template-columns:minmax(0,1fr)}
  .bay{position:static}
  .blk-card{width:100%;max-width:250px;margin:0 auto}
  .teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}
@media(max-width:640px){
  .top{flex-wrap:wrap;padding:10px 14px}
  .tabs{margin-left:0;width:100%;overflow-x:auto}
  .tabs button{flex:1;padding:8px 10px}
  .page{padding:14px}
  .prow,.cardgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .blk-panel h2{font-size:22px}.bidnum{font-size:40px}
  .ov-box{padding:20px 16px}
  .lb th:nth-child(n+5),.lb td:nth-child(n+5){display:none}
  .gbar{padding:10px 14px}
  .top.g{flex-wrap:nowrap}
  .pcat h2 small{flex-basis:100%}
  .btn.big{padding:12px 18px;font-size:14px}
}

/* ---------- poster theme, motion, exploded view ---------- */
.brand b{font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:.02em}
.brand>div{min-width:0}
.flag{background:conic-gradient(#fff 25%,var(--acc) 0 50%,#fff 0 75%,var(--acc) 0) 0 0/17px 17px}
.tabs button.on{box-shadow:0 0 18px -4px var(--acc)}
.panel{background:linear-gradient(180deg,#122030,#0b141d)}
.mutebtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--txt);flex:none}
.mutebtn svg{width:18px;height:18px}
.mutebtn.off{color:var(--acc)}
.page.enter>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.page.enter>*:nth-child(2){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
#wipe{position:fixed;inset:0;z-index:90;pointer-events:none;display:flex}
#wipe i{flex:1;background:linear-gradient(180deg,#e8483b,#85201a);transform:scaleY(0)}
#wipe.run i{animation:wipe .7s cubic-bezier(.7,0,.3,1) both;animation-delay:calc(var(--i)*12ms)}
@keyframes wipe{0%{transform:scaleY(0);transform-origin:top}40%,65%{transform:scaleY(1);transform-origin:top}66%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.hero{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:24px;align-items:center;margin-bottom:30px}
.hero .eyebrow{color:var(--acc)}
.mega{font-family:var(--tall);font-weight:400;font-size:clamp(60px,10vw,160px);line-height:.9;text-transform:uppercase;margin:8px 0 12px;letter-spacing:.01em}
.mega span{color:transparent;-webkit-text-stroke:2px var(--acc);margin-right:.06em}
.hero-x{position:relative;min-width:0}
.hero-x::before{content:"";position:absolute;inset:6% 12%;background:radial-gradient(closest-side,#e23a2e55,transparent);filter:blur(24px)}
.card.tilt{z-index:4}
.card.tilt .card-tilt{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.05)}
@keyframes deal{from{transform:translateY(70px) rotateY(-75deg) rotate(7deg) scale(.6);opacity:0}}
.blk-panel h2,.hud b,.cratewrap h1,.winner b{font-family:var(--disp);font-weight:700}
.blk-panel h2{font-size:22px;line-height:1.15}
.hud b{font-size:16px}
.winner{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
#board{overflow-x:auto}
/* exploded view */
.xv{width:100%;display:block;overflow:visible;position:relative}
.xv .xg{transition:transform 1.1s cubic-bezier(.2,.9,.2,1);transition-delay:calc(var(--k,0)*55ms)}
.xv.ex .xg{transform:translate(var(--dx,0px),var(--dy,0px))}
.xv .xg *{vector-effect:non-scaling-stroke;stroke:#ffffff66;stroke-width:1.2;fill:#ffffff0d;stroke-linejoin:round;stroke-linecap:round;transition:stroke .3s,fill .3s}
.xv .xg.on *{stroke:var(--hc);fill:color-mix(in srgb,var(--hc) 30%,transparent);stroke-width:2}
.xv .xg.on{filter:drop-shadow(0 0 6px var(--hc));animation:xpulse 1.5s ease-in-out infinite}
@keyframes xpulse{50%{filter:drop-shadow(0 0 18px var(--hc)) brightness(1.35)}}
.xv .xg .nf{fill:none!important}
.xv .xl{opacity:0;transition:opacity .5s .75s}
.xv.ex .xl{opacity:1}
.xv.keep .xl.on{opacity:1}
.xl polyline{stroke:#ffffff55;stroke-width:1;fill:none;stroke-dasharray:2 3}
.xl circle{fill:#ffffff99}
.xl text{fill:#ffffffb0;font-size:12px;font-weight:700;letter-spacing:.16em}
.xl text.s{font-size:10.5px;font-weight:500;letter-spacing:.04em;fill:#ffffff80}
.xl.on text{fill:#fff}
.xl.on text.s,.xl.on circle{fill:var(--hc)}
.xl.on polyline{stroke:var(--hc);stroke-dasharray:none}
.xv [data-act]{cursor:pointer}
.xv .xg[data-act]:not(.on):hover *{stroke:#fff;fill:#ffffff22}
/* auction stage */
.ov-box.stage{width:100%;max-width:1440px;padding:30px;background:radial-gradient(900px 520px at 50% 34%,#1f4766,#0f2131 62%,#070e15);border-color:#2c4c66;overflow:hidden;overflow:clip;animation:stagein .55s cubic-bezier(.7,0,.2,1) both}
@keyframes stagein{from{clip-path:inset(0 50% 0 50%);opacity:.3}to{clip-path:inset(0 0 0 0)}}
.ov-box.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 13px,#00000033 13px 15px,transparent 15px 31px,#ffffff0a 31px 32px)}
.ghostw{position:absolute;left:0;right:0;top:1%;text-align:center;font-family:var(--tall);font-size:min(27vw,400px);line-height:.9;text-transform:uppercase;color:#ffffff10;pointer-events:none;white-space:nowrap;animation:ghost 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ghost{from{transform:translateX(9%);opacity:0}}
.blk{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"x" "card" "panel";gap:22px;align-items:center}
.blk-x{grid-area:x;min-width:0}
.blk-card{grid-area:card;width:100%;max-width:250px;margin:0 auto}
.blk-panel{grid-area:panel;min-width:0}
@media(min-width:760px){.blk{grid-template-columns:260px minmax(0,1fr);grid-template-areas:"x x" "card panel";gap:26px}.blk-x{max-width:780px;margin:0 auto;width:100%}}
@media(min-width:1240px){.blk{grid-template-columns:300px minmax(0,1fr) 400px;grid-template-areas:"card x panel"}.blk-card{max-width:none}.ov-box.stage{padding:44px 36px}}
.cardin{animation:cardin 1s cubic-bezier(.2,.8,.2,1) both;transform-style:preserve-3d}
@keyframes cardin{from{transform:translateY(90px) rotateY(-400deg) scale(.3);opacity:0}}
.stage .bidbox{background:#00000070;border-color:#ffffff22}
.bidnum.bump{animation:bump .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{from{transform:scale(1.5);color:#fff}}
.flash{position:fixed;inset:0;z-index:95;pointer-events:none;background:var(--c);animation:flash .7s ease-out both}
@keyframes flash{from{opacity:.75}to{opacity:0}}
.cf{position:fixed;left:50%;top:42%;z-index:96;pointer-events:none}
.cf i{position:absolute;width:9px;height:15px;background:var(--c);animation:cf 1.6s cubic-bezier(.1,.7,.3,1) both}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
/* garage extras */
.xbtn{position:absolute;top:10px;right:10px;z-index:3;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:#000a;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.carbox.jolt .carsvg,.carbox.jolt .xv{animation:jolt .5s cubic-bezier(.3,1.6,.4,1)}
@keyframes jolt{0%{transform:translateY(-16px) scale(1.04)}55%{transform:translateY(3px)}}
.carbox .xv{padding:26px 0 6px}
/* intro */
#intro{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:#b52a21;cursor:pointer;text-align:center;transition:transform .8s cubic-bezier(.7,0,.2,1) .28s}
#intro .bars{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#e8483b 0 3px,#c92f26 3px 9px,#ee5547 9px 10px,#9c241c 10px 22px,#d8342a 22px 26px,#872018 26px 41px);animation:barshift 9s linear infinite}
@keyframes barshift{to{background-position:410px 0}}
#intro .sil{position:absolute;left:50%;bottom:9%;width:min(1250px,130vw,150vh);transform:translateX(-50%);fill:#0a0102;opacity:.93;
  -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 9px,#000 9px 19px,#0007 19px 23px);mask-image:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 9px,#000 9px 19px,#0007 19px 23px);
  -webkit-box-reflect:below 0 linear-gradient(transparent 55%,#0006);animation:jit 3.2s steps(1) infinite}
@keyframes jit{0%,100%{transform:translateX(-50%)}12%{transform:translateX(-50.7%) skewX(-3deg)}14%{transform:translateX(-49.5%)}52%{transform:translateX(-50.3%) skewX(2deg)}54%{transform:translateX(-50%)}}
#intro .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 25%,#2a0a08d8 100%),linear-gradient(180deg,transparent 60%,#000000b0)}
#intro .c{position:relative;padding:20px;transition:transform .55s cubic-bezier(.6,0,.9,.4),opacity .45s}
.in-lights{display:flex;gap:14px;justify-content:center;margin-bottom:30px}
.in-lights i{width:30px;height:30px;border-radius:50%;background:#3a0f0b;box-shadow:inset 0 0 0 3px #00000066}
.in-lights i.on{background:#e8483b;box-shadow:0 0 26px #e8483b,0 0 70px #e8483b80}

/* ---------- the parts crate: a 3D flight case that rattles, then bursts open ---------- */
.crate3{--W:300px;--H:190px;--D:170px;width:var(--W);height:var(--H);position:relative;perspective:1100px;margin:30px auto 36px;cursor:pointer}
.cbox{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-14deg) rotateY(26deg);animation:cidle 5.5s ease-in-out infinite}
.crate3.shaking .cbox{animation:cshake .95s cubic-bezier(.36,.07,.19,.97) both}
.crate3.open .cbox{animation:chop .9s cubic-bezier(.2,1.4,.4,1) both}
.cface{position:absolute;background:#161617;border:1.5px solid #2c2c2e;box-sizing:border-box;box-shadow:inset 0 0 0 1px #000;background-image:radial-gradient(circle,#4a4a4e 0 1.2px,transparent 1.6px),radial-gradient(circle,#4a4a4e 0 1.2px,transparent 1.6px);background-size:16px 100%,100% 16px;background-position:0 7px,7px 0;background-repeat:repeat-x,repeat-y}
.cfront{inset:0;transform:translateZ(calc(var(--D)/2));overflow:hidden;background-color:#1a1a1b}
.cback{inset:0;transform:translateZ(calc(var(--D)/-2)) rotateY(180deg);background-color:#0e0e0f}
.cleft,.cright{top:0;bottom:0;width:var(--D);left:0;transform-origin:left;transform:translateZ(calc(var(--D)/2)) rotateY(90deg);background-color:#0b0b0c}
.cright{left:auto;right:0;transform-origin:right;transform:translateZ(calc(var(--D)/2)) rotateY(-90deg);background-color:#121213}
.cbottom{left:0;right:0;bottom:0;height:var(--D);transform-origin:bottom;transform:translateZ(calc(var(--D)/-2)) rotateX(90deg);background:#000}
.clid{left:0;right:0;top:0;height:var(--D);transform-origin:top;transform:translateZ(calc(var(--D)/-2)) rotateX(-90deg);background-color:#222224;transition:transform 1s cubic-bezier(.3,1.3,.4,1);overflow:hidden}
.clidtop{position:absolute;inset:14px;border:1px solid #ffffff22;background:repeating-linear-gradient(90deg,transparent 0 22px,#ffffff08 22px 24px)}
.clidtop::after{content:"";position:absolute;left:50%;top:50%;width:48%;height:10px;transform:translate(-50%,-50%);background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/10px 10px;opacity:.9}
.crate3.open .clid{transform:translateZ(calc(var(--D)/-2)) rotateX(-215deg)}
.ctape{position:absolute;left:0;right:0;top:0;height:9px;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/9px 9px}
.chaz{position:absolute;left:0;right:0;bottom:0;height:20px;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#0a0a0a 12px 24px);border-top:1.5px solid #000}
.ccrest{position:absolute;left:50%;top:50%;transform:translate(-50%,-62%);filter:drop-shadow(0 6px 10px #000)}
.cstencil{position:absolute;left:0;right:0;bottom:30px;text-align:center;color:#d9d9d9;pointer-events:none}
.cstencil b{display:block;font-family:var(--tall);font-weight:400;font-size:20px;letter-spacing:.08em;text-transform:uppercase;line-height:1;opacity:.9;-webkit-mask:repeating-linear-gradient(0deg,#000 0 2px,transparent 2px 3px);mask:repeating-linear-gradient(0deg,#000 0 2px,transparent 2px 3px)}
.cstencil small{display:block;margin-top:4px;font:600 8px/1 var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--acc)}
.clatch{position:absolute;top:14px;left:26px;width:22px;height:30px;border:2px solid #777;border-radius:3px;background:linear-gradient(180deg,#5a5a5e,#2a2a2c);box-shadow:0 2px 4px #000}
.clatch.r{left:auto;right:26px}
.cin{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.cglow{position:absolute;left:8%;right:8%;top:0;height:60%;transform:translateZ(0);background:radial-gradient(ellipse at 50% 0,var(--c),transparent 70%);opacity:0;transition:opacity .4s}
.cbeam{position:absolute;left:50%;bottom:50%;width:70%;height:420px;transform:translateX(-50%) scaleY(0);transform-origin:bottom;background:linear-gradient(0deg,#ffffffcc,color-mix(in srgb,var(--c) 70%,#fff) 30%,transparent 100%);clip-path:polygon(28% 100%,72% 100%,100% 0,0 0);opacity:0;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .4s;mix-blend-mode:screen}
.cparts{position:absolute;left:0;right:0;top:0;height:0}
.cparts i{position:absolute;left:50%;top:0;width:34px;height:48px;margin-left:-17px;border-radius:4px;background:#f4f2ef;border:2px solid #1a1614;box-shadow:0 10px 20px #000a;opacity:0}
.crate3.open .cglow{opacity:1}
.crate3.open .cbeam{opacity:1;transform:translateX(-50%) scaleY(1)}
.crate3.open .cparts i{animation:cfly 1.2s cubic-bezier(.2,.8,.3,1) both}
.cparts i:nth-child(1){--dx:-110px;--r:-30deg;animation-delay:.25s}.cparts i:nth-child(2){--dx:-45px;--r:-12deg;animation-delay:.32s}.cparts i:nth-child(3){--dx:10px;--r:4deg;animation-delay:.4s}.cparts i:nth-child(4){--dx:70px;--r:18deg;animation-delay:.47s}.cparts i:nth-child(5){--dx:130px;--r:34deg;animation-delay:.55s}
@keyframes cfly{0%{opacity:0;transform:translate(0,40px) rotate(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-300px) rotate(var(--r)) scale(1.1)}}
@keyframes cidle{0%,100%{transform:rotateX(-14deg) rotateY(26deg) translateY(0)}50%{transform:rotateX(-12deg) rotateY(22deg) translateY(-8px)}78%{transform:rotateX(-13deg) rotateY(24deg) translateY(-3px)}80%{transform:rotateX(-13deg) rotateY(24deg) translateY(-3px) translateX(-3px) rotateZ(-1.5deg)}82%{transform:rotateX(-13deg) rotateY(24deg) translateY(-5px) translateX(3px) rotateZ(1.5deg)}84%{transform:rotateX(-13deg) rotateY(24deg) translateY(-2px) translateX(-2px) rotateZ(-1deg)}86%{transform:rotateX(-13deg) rotateY(24deg) translateY(-3px) translateX(2px) rotateZ(1deg)}88%{transform:rotateX(-13deg) rotateY(24deg) translateY(-3px)}}
@keyframes cshake{0%{transform:rotateX(-14deg) rotateY(26deg) translate(0,0)}10%{transform:rotateX(-14deg) rotateY(26deg) translate(-4px,2px) rotateZ(-2deg)}20%{transform:rotateX(-14deg) rotateY(26deg) translate(5px,-3px) rotateZ(2deg)}30%{transform:rotateX(-14deg) rotateY(26deg) translate(-7px,3px) rotateZ(-3deg)}40%{transform:rotateX(-14deg) rotateY(26deg) translate(8px,-4px) rotateZ(3deg)}50%{transform:rotateX(-14deg) rotateY(26deg) translate(-10px,5px) rotateZ(-4deg)}60%{transform:rotateX(-14deg) rotateY(26deg) translate(10px,-6px) rotateZ(4deg)}70%{transform:rotateX(-14deg) rotateY(26deg) translate(-12px,6px) rotateZ(-5deg)}80%{transform:rotateX(-14deg) rotateY(26deg) translate(12px,-8px) rotateZ(5deg)}90%{transform:rotateX(-14deg) rotateY(26deg) translate(-8px,6px) rotateZ(-3deg)}100%{transform:rotateX(-14deg) rotateY(26deg) translate(0,0)}}
@keyframes chop{0%{transform:rotateX(-14deg) rotateY(26deg) translateY(0)}35%{transform:rotateX(-20deg) rotateY(26deg) translateY(-26px)}100%{transform:rotateX(-16deg) rotateY(26deg) translateY(0)}}
.crate3.shaking .ccrest{animation:none}
@media(max-width:560px){.crate3{--W:230px;--H:150px;--D:130px}.cstencil b{font-size:15px}.clatch{width:16px;height:22px}}

/* ---------- broadcast overlay ---------- */

  const step = (w - 14) / per, r = Math.min(9, step * .38);

    const cx = x0 + 7 + step * (i + .5), cy = rows === 2 ? y0 + 15 + j * (bh - 30) : 50;

let ruleI = 0, hostOpen = false, rdrag = null;
const rules = () => [
  [fmt(S.budget) + ' credits', 'Your war chest.', 'Every team starts with the same budget. Spend it or lose it: nothing carries over to the race.'],
  S.raise ? ['+' + S.raise + '%', 'The clock climbs fast.', `The price on the block goes up at least ${S.raise}% a step, never less than ${fmt(S.step)} credits. Keep your paddle up while you still want the part.`]
    : ['+' + fmt(S.step), `The clock climbs in ${fmt(S.step)}s.`, `The price on the block goes up ${fmt(S.step)} credits a step. Keep your paddle up while you still want the part.`],
  ['24', 'Parts. One of each.', 'Four categories, six parts in each. When the hammer drops, that part is gone for good.'],
  ['4', 'Free parts. No excuses.', 'Everyone gets a basic engine, exhaust, gearbox and body. Lose every bid and you still race.'],
  ['SOLD', 'Last paddle standing.', `Be the last paddle up and the part is yours at the price on the clock. No take-backs, no refunds, no sulking.`],
  ['1', 'Car per team.', 'Open your crate, fit one part per slot, name your machine and send back the build code.'],
  ['1+', 'Hoard if you dare.', 'You may buy more than one part per category, but only 1 per category goes in your car.'],
];
const pad2 = n => String(n).padStart(2, '0');
function deckHTML() { const R = rules(), n = R.length; return R.map(([v, h, t], i) => { const q = (i - ruleI + n) % n; return `<article class="rcard c${i % 3}" style="--p:${Math.min(q, 4)}"${q > 3 ? ' data-h="1"' : ''} data-i="${i}"><span class="rn">Rule ${pad2(i + 1)}</span><div class="rv">${esc(v)}</div><h3>${esc(h)}</h3><p>${esc(t)}</p></article>`; }).join(''); }
function layDeck() {
  const d = $('#deck'); if (!d) return; const n = d.children.length;
  [...d.children].forEach((c, i) => { const q = (i - ruleI + n) % n; c.style.setProperty('--p', Math.min(q, 4)); if (q > 3) c.setAttribute('data-h', '1'); else c.removeAttribute('data-h'); });
  const rc = $('#rcount'); if (rc) rc.textContent = pad2(ruleI + 1) + ' / ' + pad2(n);
}
function fling(sign) {
  const d = $('#deck'), top = d && d.children[ruleI]; if (!top || top.dataset.fly) return;
  top.dataset.fly = 1; top.style.transition = 'transform .3s ease-in, opacity .3s'; top.style.transform = `translateX(${sign * 130}%) rotate(${sign * 18}deg)`; top.style.opacity = 0; SFX.flip();
  setTimeout(() => { top.style.transition = 'none'; top.style.transform = ''; top.style.opacity = ''; delete top.dataset.fly; ruleI = (ruleI + 1) % d.children.length; layDeck(); void top.offsetWidth; top.style.transition = ''; }, 300);
}
function prevRule() { const n = rules().length; ruleI = (ruleI - 1 + n) % n; SFX.flip(); layDeck(); }

function revealRule(x) { x.classList.add('in'); const d = document.querySelectorAll('.dots b')[+x.dataset.i]; if (d) d.classList.add('on'); }
function revealBrief() { document.querySelectorAll('[data-reveal]:not(.in)').forEach(x => { const r = x.getBoundingClientRect(); if (r.top < window.innerHeight * .72 && r.bottom > 0) revealRule(x); }); }
function observeBrief() {
  if (briefObs) briefObs.disconnect(); briefObs = null;
  const secs = document.querySelectorAll('[data-reveal]'); if (!secs.length) return;
  briefObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) revealRule(e.target); }), {threshold: .25});

}

  if (!/^#[0-9a-f]{6}$/i.test(GS.livery || '')) GS.livery = '';

    [en.hp >= 550 && gb.gears <= 5, `A ${en.name} through a five-speed? Brave. The gearbox has filed a complaint.`],
    [en.art.turbo && ex.tier >= 5, 'Boost plus open pipes. The neighbours are now stakeholders.'],
    [ae.tier === 6, 'Drag kit on. Four hundred metres of straight line and we own every one of them.'],
    [ae.tier === 5, 'Active aero. It thinks for itself, which is more than I can say for the driver.'],
    [en.free && (gb.tier >= 4 || ae.tier >= 4), 'Race-spec everything except the engine. That is a very fast shopping trolley.'],
    [sp.mass > 1250, 'She is heavy. Let us hope the strip runs downhill.'],
    [pt > 520, `${Math.round(pt)} horsepower per tonne. Please stop grinning in my garage.`],
    [cat === 'gearbox' && gb.art.t === 'S', 'Sequential box. Bang, bang, bang, gone, exactly as advertised.'],

    [cat === 'exhaust' && ex.tier >= 4, 'Twin pipes. The crowd will hear us before they see us.'],
    [cat === 'engine' && en.art.l === 'V', `${en.art.c} cylinders. Listen to that.`],
    [cat === 'engine' && en.art.turbo, 'Turbo fitted. Wait for it… wait for it… there it is.'],
    [cat === 'aero' && ae.tier >= 3, 'More downforce on the rear. The tyres stay planted when the power arrives.'],
    [cat === 'aero', 'Cleaner air. Every little helps at the top end.'],

    boardStale = true; drawBlock(true);
    if (xv) { xv.classList.remove('ex'); xv.classList.add('keep'); xv.querySelectorAll('.on').forEach(g => g.style.setProperty('--hc', t.color)); }
    flash(t.color); confetti(t.color); document.body.classList.add('shake'); setTimeout(() => document.body.classList.remove('shake'), 520);
  },
  revoke: () => { const id = block.part; delete S.sales[id]; save(); boardStale = true; openBlock(id); },
  addTeam: () => {
    const t = newTeam(S.teams.length), late = Object.keys(S.sales).length; S.teams.push(t); retune(); save(); render();
    if (late) toast(`${t.name} joins late: they can bid on whatever is still unsold`);
  },
  rmTeam: el => {
    const id = el.dataset.id, t = team(id), go = () => { owned(id).forEach(p => delete S.sales[p]); delete S.builds[id]; S.teams = S.teams.filter(x => x.id !== id); retune(); save(); render(); };
    owned(id).length || S.builds[id] ? ask(`Removing ${t.name} also returns their parts to the auction.`, 'Remove team', go) : go();
  },
  mock: () => {
    let n = 0;
    Object.values(PARTS).filter(p => !p.free && !S.sales[p.id]).sort(() => Math.random() - .5).forEach(p => {
      const can = S.teams.filter(t => left(t.id) >= p.price); if (!can.length) return;
      const t = can[Math.random() * can.length | 0];
      let pr = p.price; for (let k = Math.random() * 14 | 0; k > 0; k--) pr += raiseFor(pr);
      S.sales[p.id] = {team: t.id, price: Math.min(left(t.id), pr)}; n++;
    });
    save(); render(); toast(n ? `Mock auction sold ${n} parts` : 'Nothing left to sell');
  },
  clearSales: () => ask('This clears every sale and every received build. Teams and settings stay.', 'Clear results', () => resetAuction(false)),
  resetAll: () => ask('This wipes the whole event, including teams. Packages already sent out will stop matching.', 'Reset everything', () => resetAuction(true)),
  dl: el => {
    const t = team(el.dataset.id), a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([packageHTML(pkgFor(t))], {type: 'text/html'})); a.download = slug(t.name) + '-parts-crate.html';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast(`Package saved for ${t.name}`);
  },
  copyLink: el => copy(linkFor(team(el.dataset.id)), hosted() ? 'Link copied' : 'Link copied (works on this computer until the app is hosted)'),
  preview: el => window.open(linkFor(team(el.dataset.id)), '_blank'),
  start: () => cineStart(),
  songClear: () => { songSet(null); songDB(st => st.delete('song')); const e = $('#songname'), b = $('#songclr'); if (e) e.textContent = 'Built-in soundtrack'; if (b) b.hidden = true; },
  copyResult: () => S.last ? copy(resultCode(), 'Result code copied') : toast('Run the race first', true),
  combine: () => addResults($('#combo').value),
  comboShow: () => showOverlay(`<div class="eyebrow">${esc(S.title || 'Grand Bid Prix')} · combined results</div><h2 style="font-family:var(--disp);font-size:26px;margin:6px 0 14px;text-transform:uppercase">Leaderboard</h2>${comboHTML()}`, 'wide'),
  comboClear: () => { S.combo = {}; save(); const l = $('#combo-board'); if (l) l.innerHTML = comboHTML(); toast('Other laptops\' results cleared'); },
  cineSkip, cineClose,
  importBuilds: () => { const r = importCodes($('#imp').value); render(); reportImport(r); },
  openCrate: () => {
    const go = () => { GS.opened = true; revealing = true; store(gkey(), GS); render(); window.scrollTo(0, 0); revealSeq(); };
    const c = $('#crate3'); if (!c || c.classList.contains('shaking')) return c ? null : go();
    c.classList.add('shaking'); SFX.hit(); setTimeout(() => SFX.hit(), 330); setTimeout(() => SFX.hit(), 620);
    setTimeout(() => { c.classList.add('open'); SFX.crate(); SFX.whoosh(); flash(livery()); confetti(livery()); }, 950);
    setTimeout(() => wipe(go, true), 2100);
  },
  enterGarage: () => wipe(() => { revealing = false; dealing = true; dynoPrev = lapPrev = null; render(); window.scrollTo(0, 0); }, true),
  install: el => {
    const p = PARTS[el.dataset.part]; if (GS.build[p.cat] === p.id) return;
    GS.build[p.cat] = p.id; store(gkey(), GS); jolt = true; lastCat = p.cat; SFX.wrench(); render();
    const v = VIEWS.garage; if (v) { v.user = 'ex'; v.userAt = v.time; clearTimeout(asmT); asmT = setTimeout(() => { v.user = 'so'; }, 700); }
  },
  testLap: () => { if (!GS.opened) return; shakedown(); },
  xview: () => { showX = !showX; xAnim = showX; render(); },
  mute: () => { SFX.toggle(); if (SONG && SONG.el) SONG.el.muted = SFX.muted(); const b = $('.mutebtn'); if (b) b.outerHTML = muteBtn(); SFX.click(); },
  intro: () => intro(true),
  emblem: el => { const t = team(el.dataset.id); t.em = ((+t.em || 0) + 1) % EMB.length; save(); el.innerHTML = badge(t, 40); },
  ruleNext: () => fling(-1),
  rulePrev: prevRule,
  host: el => { hostOpen = !el.parentNode.open; },
  gotoCat: el => { const s = $('#cat-' + el.dataset.cat); if (s) s.scrollIntoView({behavior: 'smooth', block: 'start'}); },
  lock: () => {
    if (lockT) return; SFX.engineStart(); SFX.rev(); const cb = $('.carbox'); if (cb) cb.classList.add('rev');
    const v = VIEWS.garage; if (v) { v.user = 'ex'; v.userAt = v.time; setTimeout(() => { v.user = 'so'; }, 900); }
    lockT = setTimeout(() => { lockT = 0; SFX.engineStop(); wipe(showTicket, true); }, 1500);
  },
  copyCode: () => copy(buildCode(), 'Build code copied'),
  copyReturn: () => copy(PKG.home + '#build=' + buildCode(), 'Return link copied'),
  shareCode: () => { navigator.share({title: (GS.car.trim() || PKG.team.name) + ' build', text: buildCode()}).catch(() => {}); },
};
const INP = {
  title: el => { S.title = el.value; save(); const b = $('.brand b'); if (b) b.textContent = S.title; },
  budget: el => { S.budget = Math.max(0, Math.round(+el.value || 0)); reprice(S.budget); retune(); save(); const d = $('#deck'); if (d) d.innerHTML = deckHTML(); },
  step: el => { S.step = Math.max(1, Math.round(+el.value || 1)); retune(); save(); const d = $('#deck'); if (d) d.innerHTML = deckHTML(); },
  group: el => { S.group = el.value.trim().slice(0, 12); save(); },
  song: el => { const f = el.files && el.files[0]; if (!f) return; songSet(f, f.name); songDB(st => st.put({blob: f, name: f.name}, 'song')); const e = $('#songname'), b = $('#songclr'); if (e) e.textContent = f.name; if (b) b.hidden = false; toast('Race music: ' + f.name); },
  tname: el => { team(el.dataset.id).name = el.value.trim() || 'Team'; save(); },
  tcolor: el => { team(el.dataset.id).color = el.value; save(); },
  next: el => { if (block && el.value) block.price = Math.max(PARTS[block.part].price, Math.round(+el.value || 0)); },
  auto: el => { S.auto = el.checked; save(); render(); },
  car: el => { GS.car = el.value; store(gkey(), GS); const b = $('.gbar .sum b'); if (b) b.textContent = GS.car.trim() || PKG.team.name; },
  livery: el => { GS.livery = el.value; store(gkey(), GS); const bay = $('.bay'); if (bay) bay.style.setProperty('--c', el.value); if (V3CFG.garage) { V3CFG.garage = Object.assign({}, V3CFG.garage, {color: el.value}); const v = VIEWS.garage; if (v) v.set(V3CFG.garage); } },
};
const SND = {flip: 'flip', tab: 'whoosh', cat: '', toFolders: '', open: 'whoosh', xview: 'whoosh', sold: 'gavel', openCrate: 'crate', undoBid: 'undo', nudge: '', raiseBid: '', nextLot: 'whoosh', bid: '', lotTime: 'tick', copyResult: '', combine: '', comboShow: 'whoosh', comboClear: 'tick', install: '', start: '', mute: '', emblem: 'tick', ruleNext: '', rulePrev: '', host: 'tick', lock: '', testLap: 'whoosh', enterGarage: '', cineSkip: 'tick', cineClose: 'whoosh'};
document.addEventListener('pointerdown', () => SFX.unlock(), true);
document.addEventListener('keydown', () => SFX.unlock(), true);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act; if (!ACT[a]) return;
  SFX.unlock(); if (a in SND) { if (SND[a]) SFX[SND[a]](); } else SFX.click();
  ACT[a](el, e);
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && INP[el.dataset.in]) INP[el.dataset.in](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.innerHTML) return closeOverlay();
  if (MODE === 'org' && S.tab === 'setup' && !overlay.innerHTML && !$('#intro') && !/INPUT|TEXTAREA/.test(e.target.tagName)) { if (e.key === 'ArrowRight') fling(-1); else if (e.key === 'ArrowLeft') prevRule(); }
});
document.addEventListener('pointerdown', e => { const c = e.target.closest ? e.target.closest('.rcard') : null; if (!c || +c.dataset.i !== ruleI || c.dataset.fly) return; rdrag = {c, x: e.clientX, dx: 0}; c.style.transition = 'none'; });
document.addEventListener('pointermove', e => { if (!rdrag) return; rdrag.dx = e.clientX - rdrag.x; rdrag.c.style.transform = `translateX(${rdrag.dx}px) rotate(${rdrag.dx / 22}deg)`; });
const endDrag = () => { if (!rdrag) return; const c = rdrag.c, dx = rdrag.dx; rdrag = null; c.style.transition = ''; if (Math.abs(dx) > 80) fling(Math.sign(dx)); else c.style.transform = ''; };
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
window.addEventListener('resize', () => { if (race && MODE === 'org' && S.tab === 'race') drawRace(); });
// keep several organiser tabs/windows in step instead of overwriting each other
window.addEventListener('storage', e => {
  if (MODE !== 'org' || e.key !== LS || !e.newValue) return;
  let n; try { n = JSON.parse(e.newValue); } catch (err) { return; }
  if (!n || !Array.isArray(n.teams)) return;
  S = Object.assign(fresh(), n, {tab: S.tab, cat: S.cat, track: S.track}); reprice(S.budget);
  if (!overlay.innerHTML && !busy()) render();
});
window.addEventListener('hashchange', () => { if (/^#(pkg|build)=/.test(location.hash)) location.reload(); });

let tiltEl = null;
const untilt = el => { el.classList.remove('tilt'); el.style.removeProperty('--rx'); el.style.removeProperty('--ry'); };
let tiltE = null, tiltQ = 0;
document.addEventListener('pointermove', e => { tiltE = e; if (!tiltQ) tiltQ = requestAnimationFrame(tiltFrame); });
function tiltFrame() {
  tiltQ = 0; const e = tiltE, c = e.target.closest ? e.target.closest('.card') : null;
  if (tiltEl && tiltEl !== c) untilt(tiltEl);
  if (c && c !== tiltEl) SFX.tick();
  tiltEl = c; if (!c) return;
  const r = c.getBoundingClientRect(), x = clamp((e.clientX - r.left) / r.width), y = clamp((e.clientY - r.top) / r.height);
  c.classList.add('tilt');
  c.style.setProperty('--ry', ((x - .5) * 26).toFixed(1) + 'deg'); c.style.setProperty('--rx', ((.5 - y) * 20).toFixed(1) + 'deg');
  c.style.setProperty('--mx', (x * 100).toFixed(0) + '%'); c.style.setProperty('--my', (y * 100).toFixed(0) + '%');
}
document.addEventListener('pointerleave', () => { if (tiltEl) { untilt(tiltEl); tiltEl = null; } });
document.addEventListener('pointerup', e => { if (e.pointerType === 'touch' && tiltEl) { untilt(tiltEl); tiltEl = null; } });

function resumePrompt() {
  const n = Object.keys(S.sales).length, b = Object.keys(S.builds).length;
  if (!n && !b) return;
  showOverlay(`<div class="eyebrow">Welcome back</div><h2 style="font-family:var(--disp);font-size:22px;margin:6px 0 10px;text-transform:uppercase">Auction in progress</h2><p style="color:var(--mut)">${n} of 24 parts sold${b ? ` and ${b} build${b === 1 ? '' : 's'} received` : ''}. Carry on where you left off, or wipe the results and start the auction again? Teams and settings stay either way.</p><div class="btnrow"><button class="btn pri" data-act="closeOverlay">Continue the auction</button><button class="btn ghost" data-act="yes">Reset the auction</button></div>`);
  pendingYes = () => resetAuction(false, true);
}

/* ================= boot ================= */
(function boot() {
  const h = location.hash;
  const ico = document.createElement('link'); ico.rel = 'icon'; ico.href = 'data:image/svg+xml,' + encodeURIComponent(LOGO); document.head.appendChild(ico);
  const w = document.createElement('canvas'); w.id = 'wipe'; document.body.appendChild(w);
  try { PKG = window.__PKG__ || (h.startsWith('#pkg=') ? dec(h.slice(5)) : null); } catch (e) { PKG = null; }
  if (PKG && PKG.team && PKG.team.id && Array.isArray(PKG.parts)) { MODE = 'garage'; initGarage(); document.title = PKG.team.name + ' — Garage'; render(); intro(); load3D(); return; }
  const saved = fetchStore(LS);
  S = saved ? Object.assign(fresh(), saved) : brandNew();
  if (!Array.isArray(S.teams) || S.teams.length < 2) S = brandNew();
  if (S.title === 'Auction Grand Prix') S.title = 'Grand Bid Prix';
  if (!S.step5) { S.step5 = 1; S.step = 5; }
  S.teams.forEach((t, i) => { if (t.em == null) t.em = i % 12; });
  if (!S.k10) { S.k10 = 1; S.budget = 10000; S.step = 50; Object.values(S.sales).forEach(x => { x.price *= 10; }); }
  // raises that scale with the bid (about a 45-minute auction for 12 teams); a host's own minimum step is kept
  if (!S.p45) { S.p45 = 1; if (S.step === 50) S.step = 100; if (S.raise == null) S.raise = 10; }
  reprice(S.budget); retune();
  let imported = null; S.tab = 'setup'; S.track = 'drag';
  try { history.scrollRestoration = 'manual'; } catch (e) {}
  if (h.startsWith('#build=')) { imported = importCodes(h.slice(7)); S.tab = 'race'; history.replaceState(null, '', location.pathname + location.search); }
  save(); render(); intro(); load3D(); resumePrompt(); syncStart(); songLoad();
  if (imported) reportImport(imported);
  if (h.startsWith('#pkg=')) toast('That package link could not be read', true);
})();
})();
</script>
</body>
